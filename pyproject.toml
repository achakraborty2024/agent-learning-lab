[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning-lab"
version = "0.1.0"
description = "Evaluate experience-driven memory improvement with Letta and MemGPT-inspired agents"
requires-python = ">=3.10"
authors = [{name = "Arup Chakraborty"}]
dependencies = []

[project.scripts]
agent-learning-lab = "agent_learning_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_learning_lab*"]
